name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  schedule:
    - cron: "45 21 * * 3"

env:
  INFLUENCA_MEDIA_DIR: ~/pictures-and-videos
  OTHER: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @influenca/web exec playwright install --with-deps chromium

      - name: Run Lint
        run: pnpm run lint

      - name: Run Build/Test
        run: pnpm run typecheck && pnpm test
